<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width">
        <link rel="stylesheet" href="style.css">
        <title>Pricing Section</title>
    </head>

    <body>
        <div class="Text">
            <h1>Simple pricing for every designer</h1>
            <p>Start free. Upgrade when your projects grow.</p>
        </div>
        <div class="card-row">
          <div class="card featured">
             <h3>Free</h3>
             <p class="plan-desc">For trying things out</p>
          </div>

          <div>
            <p class="price"> <span class="amount">$0</span>/month</p>
          </div>

          <div>
            <li><span class="check">✓</span> 3 projects</li>
            <li><span class="check">✓</span> Basic templates</li>
            <li><span class="check">✓</span> PNG export</li>
            <li><span class="check">✓</span> Community support</li>
          </div>

          <div class="btn">
            <a href="#" target="_blank" rel="noopener">Get Started</a>
          </div>
          
        </div>
        
    </body>
</html>
