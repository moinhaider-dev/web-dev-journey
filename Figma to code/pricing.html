<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width">
        <link rel="stylesheet" href="style.css">
        <title>Pricing Section</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100..900&display=swap" rel="stylesheet">
    </head>

    <body>
        <div class="text">
            <h1>Simple pricing for every designer</h1>
            <p>Start free. Upgrade when your projects grow.</p>
        </div>

        <div class="card">
          <div class="plan">
             <h3>Free</h3>
             <p class="plan-desc">For trying things out</p>
          </div>

          <div>
            <p class="price"> <span class="amount">$0</span>/month</p>
          </div>

          <div class="ul">
            <ul>

              <li><span class="check">✓</span> 3 projects</li>
              <li><span class="check">✓</span> Basic templates</li>
              <li><span class="check">✓</span> PNG export</li>
              <li><span class="check">✓</span> Community support</li>
             </ul>
          </div>

          <div class="btn">
            <a href="#" target="_blank" rel="noopener">Get Started</a>
          </div>

        </div>
        
    </body>
</html>
